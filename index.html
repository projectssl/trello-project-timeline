<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Timeline Power-Up</title>
</head>

<body>

<script src="https://p.trellocdn.com/power-up.min.js"></script>

<script>
  const BASE_URL = new URL(".", window.location.href).href;

  window.TrelloPowerUp.initialize(
    {
      "board-buttons": function (t) {
        return [
          {
            text: "Project Timeline",
            condition: "signedIn",
            callback: function (t) {
              return t.modal({
                url: BASE_URL + "timeline.html?v=2",
                title: "Project Timeline",
                fullscreen: true,
                accentColor: "#434E46"
              });
            }
          }
        ];
      }
    },
    {
      appKey: "b82c41f13fc90820cc581fe1c8ecb160",
      appName: "Project Timeline",
      appAuthor: "Sarah Louise"
    }
  );
</script>

</body>
</html>
