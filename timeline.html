<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Project Timeline</title>

  <style>
    :root {
      --governor: #434E46;
      --moss: #A6BDA6;
      --mahogany: #4E1C11;
      --espresso: #2C1511;
      --ivory: #FFFBF2;
      --brass: #887255;

      --text: #172B4D;
      --muted: #626F86;

      --border: #DFE1E6;
      --border-light: #EBECF0;

      --background: #F7F8F9;
      --panel: #FFFFFF;
      --hover: #F7F8F9;

      --due-soon: #FFF7D6;
      --due-soon-border: #D6A400;
      --due-soon-text: #7F5F01;

      --overdue: #FFEBE6;
      --overdue-border: #AE2A19;
      --overdue-text: #AE2A19;

      --blue: #0C66E4;
      --blue-hover: #0055CC;

      --day-width: 42px;
      --left-width: 310px;
      --row-height: 76px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      font-size: 14px;
      color: var(--text);
      background: var(--background);
    }

    .page {
      padding: 14px 16px 18px;
    }

    /* ======================================================
       TOOLBAR
    ====================================================== */

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 8px;

      margin-bottom: 10px;

      background: white;
      border: 1px solid var(--border);
      border-radius: 6px;

      padding: 10px;
    }

    .filter-search {
      flex: 1;
      min-width: 220px;
    }

    .filter-label {
      display: block;
      margin-bottom: 4px;

      font-size: 11px;
      font-weight: 600;

      color: var(--muted);
    }

    .toolbar input,
    .toolbar button {
      height: 34px;

      border: 1px solid var(--border);
      border-radius: 3px;

      background: white;
      color: var(--text);

      font: inherit;

      padding: 6px 9px;
    }

    .toolbar input {
      width: 100%;
    }

    .toolbar button {
      cursor: pointer;
      font-weight: 500;
    }

    .toolbar button:hover {
      background: var(--hover);
    }

    .clear-button {
      align-self: end;
    }

    /* ======================================================
       MULTI SELECT FILTERS
    ====================================================== */

    .filter-holder {
      display: flex;
      flex-direction: column;
      min-width: 145px;
    }

    .multi-filter {
      position: relative;
      display: inline-block;
    }

    .multi-filter-button {
      width: 100%;
      min-width: 145px;
      max-width: 210px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;

      white-space: nowrap;
    }

    .multi-filter-button.active {
      border-color: var(--blue);
      color: var(--blue);
    }

    .multi-filter-arrow {
      font-size: 10px;
      color: var(--muted);
    }

    .multi-filter-menu {
      position: absolute;
      z-index: 100;

      top: calc(100% + 4px);
      left: 0;

      width: 260px;
      max-height: 360px;

      display: none;
      overflow: hidden;

      background: #FFFFFF;

      border: 1px solid var(--border);
      border-radius: 6px;

      box-shadow:
        0 8px 12px rgba(9, 30, 66, 0.15),
        0 0 1px rgba(9, 30, 66, 0.31);
    }

    .multi-filter.open .multi-filter-menu {
      display: block;
    }

    .multi-filter-actions {
      display: flex;
      justify-content: space-between;
      gap: 8px;

      padding: 8px;

      border-bottom: 1px solid var(--border-light);
    }

    .multi-filter-actions button {
      height: 28px;

      padding: 3px 8px;

      border: 0;

      background: transparent;
      color: var(--blue);

      font-size: 12px;
    }

    .multi-filter-actions button:hover {
      background: var(--hover);
      color: var(--blue-hover);
    }

    .multi-filter-options {
      max-height: 285px;
      overflow-y: auto;

      padding: 4px 0;
    }

    .multi-filter-option {
      display: flex;
      align-items: center;
      gap: 8px;

      min-height: 34px;

      padding: 6px 10px;

      cursor: pointer;

      color: var(--text);

      font-size: 13px;
    }

    .multi-filter-option:hover {
      background: var(--hover);
    }

    .multi-filter-option input {
      width: 16px;
      height: 16px;

      flex: 0 0 16px;

      margin: 0;
      padding: 0;
    }

    .multi-filter-option-text {
      flex: 1;
    }

    .filter-label-swatch {
      width: 12px;
      height: 12px;

      flex: 0 0 12px;

      border-radius: 2px;
    }

    /* ======================================================
       LEGEND
    ====================================================== */

    .legend {
      display: flex;
      align-items: center;
      flex-wrap: wrap;

      gap: 12px;

      margin-left: auto;

      font-size: 11px;
      color: var(--muted);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .legend-current {
      width: 30px;
      height: 12px;

      border-radius: 3px;

      background: var(--moss);
    }

    .legend-baseline {
      width: 30px;
      height: 6px;

      border-radius: 5px;

      background: var(--governor);
    }

    .legend-due {
      width: 13px;
      height: 13px;

      border-radius: 2px;

      background: var(--due-soon);
      border: 1px solid var(--due-soon-border);
    }

    .legend-overdue {
      width: 13px;
      height: 13px;

      border-radius: 2px;

      background: var(--overdue);
      border: 1px solid var(--overdue-border);
    }

    .summary {
      margin: 0 0 8px;

      color: var(--muted);

      font-size: 12px;
    }

    /* ======================================================
       TIMELINE SHELL
    ====================================================== */

    .timeline-shell {
      width: 100%;

      overflow: auto;

      max-height: calc(100vh - 150px);

      background: white;

      border: 1px solid var(--border);
      border-radius: 4px;
    }

    .timeline-grid {
      min-width: max-content;
    }

    .timeline-header,
    .timeline-row,
    .list-row {
      display: grid;

      grid-template-columns:
        var(--left-width)
        var(--timeline-width);
    }

    /* ======================================================
       LEFT COLUMN
    ====================================================== */

    .timeline-left {
      position: sticky;
      left: 0;

      z-index: 20;

      background: white;

      border-right: 1px solid var(--border);
    }

    .header-left {
      height: 72px;

      display: flex;
      align-items: end;

      padding: 12px;

      border-bottom: 1px solid var(--border);

      font-weight: 600;
    }

    /* ======================================================
       DATE HEADER
    ====================================================== */

    .header-track {
      position: relative;

      height: 72px;

      background: white;

      border-bottom: 1px solid var(--border);
    }

    .months {
      position: relative;

      height: 32px;

      border-bottom: 1px solid var(--border);
    }

    .month-label {
      position: absolute;

      top: 0;

      height: 32px;

      padding: 7px 8px;

      border-right: 1px solid var(--border);

      font-size: 12px;
      font-weight: 600;
    }

    .days {
      position: relative;

      height: 40px;
    }

    .day {
      position: absolute;

      top: 0;

      width: var(--day-width);
      height: 40px;

      padding-top: 4px;

      border-right: 1px solid #EEF0F2;

      text-align: center;

      font-size: 10px;

      color: var(--muted);
    }

    .day strong {
      display: block;

      margin-top: 2px;

      color: var(--text);

      font-size: 12px;
      font-weight: 600;
    }

    /* ======================================================
       LIST GROUPS
    ====================================================== */

    .list-title {
      position: sticky;
      left: 0;

      z-index: 25;

      padding: 8px 12px;

      background: #F1F2F4;

      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);

      font-size: 11px;
      font-weight: 700;

      text-transform: uppercase;

      letter-spacing: 0.04em;
    }

    .list-track {
      background: #F1F2F4;

      border-bottom: 1px solid var(--border);
    }

    /* ======================================================
       CARD DETAILS
    ====================================================== */

    .timeline-row {
      min-height: var(--row-height);
    }

    .card-info {
      position: sticky;
      left: 0;

      z-index: 15;

      min-height: var(--row-height);

      padding: 8px 10px;

      background: white;

      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);

      cursor: pointer;
    }

    .card-info:hover {
      background: var(--hover);
    }

    .card-info:hover .card-title {
      text-decoration: underline;
    }

    .card-title {
      margin-bottom: 5px;

      font-size: 12px;
      font-weight: 600;
    }

    .card-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;

      gap: 4px;
    }

    .responsible {
      margin-top: 5px;

      font-size: 11px;

      color: var(--muted);
    }

    /* ======================================================
       TRELLO LABELS
    ====================================================== */

    .label-chip,
    .activity-label {
      display: inline-flex;
      align-items: center;

      border-radius: 3px;

      white-space: nowrap;

      font-weight: 500;
    }

    .label-chip {
      min-height: 20px;

      padding: 1px 6px;

      font-size: 10px;
    }

    .activity-label {
      max-width: 110px;

      overflow: hidden;
      text-overflow: ellipsis;

      padding: 1px 5px;

      font-size: 9px;
    }

    /* ======================================================
       TIMELINE TRACK
    ====================================================== */

    .track {
      position: relative;

      height: var(--row-height);

      border-bottom: 1px solid var(--border);

      background:
        repeating-linear-gradient(
          to right,
          transparent 0,
          transparent calc(var(--day-width) - 1px),
          #F1F3F5 calc(var(--day-width) - 1px),
          #F1F3F5 var(--day-width)
        );
    }

    /* ======================================================
       CURRENT SCHEDULE BAR
    ====================================================== */

    .activity {
      position: absolute;

      top: 10px;

      height: 45px;

      min-width: 12px;

      overflow: hidden;

      padding: 5px 7px;

      background: var(--moss);

      border: 1px solid #8DA78D;
      border-radius: 5px;

      cursor: pointer;

      z-index: 2;
    }

    .activity:hover {
      outline: 2px solid rgba(67, 78, 70, 0.18);
    }

    .activity.due-soon {
      background: var(--due-soon);

      border-color: var(--due-soon-border);
    }

    .activity.overdue {
      background: var(--overdue);

      border-color: var(--overdue-border);
    }

    .activity.complete {
      opacity: 0.6;
    }

    .activity-title {
      overflow: hidden;

      white-space: nowrap;
      text-overflow: ellipsis;

      font-size: 11px;
      font-weight: 600;
    }

    .activity-bottom {
      display: flex;
      align-items: center;

      gap: 4px;

      margin-top: 4px;

      overflow: hidden;

      white-space: nowrap;
    }

    .status-badge {
      display: inline-block;

      padding: 1px 5px;

      border-radius: 3px;

      background: rgba(255, 255, 255, 0.86);

      font-size: 9px;
      font-weight: 700;
    }

    /* ======================================================
       BASELINE
    ====================================================== */

    .baseline {
      position: absolute;

      top: 57px;

      height: 7px;

      border-radius: 5px;

      background: var(--governor);

      z-index: 3;
    }

    /* ======================================================
       TODAY LINE
    ====================================================== */

    .today-line {
      position: absolute;

      top: 0;
      bottom: 0;

      width: 2px;

      background: var(--brass);

      z-index: 5;

      pointer-events: none;
    }

    .today-label {
      position: absolute;

      top: 1px;

      transform: translateX(-50%);

      padding: 2px 5px;

      border-radius: 3px;

      background: var(--brass);
      color: white;

      font-size: 9px;
      font-weight: 700;

      z-index: 10;
    }

    /* ======================================================
       MESSAGES
    ====================================================== */

    .message {
      padding: 30px;

      text-align: center;

      color: var(--muted);
    }

    .error {
      color: var(--overdue-text);
    }

    .authorize-button {
      margin-top: 12px;

      padding: 8px 14px;

      border: 0;
      border-radius: 4px;

      background: var(--governor);
      color: var(--ivory);

      cursor: pointer;

      font-weight: 600;
    }
  </style>
</head>

<body>

<div class="page">

  <div class="toolbar">

    <div class="filter-search">

      <span class="filter-label">
        Search activities
      </span>

      <input
        id="searchFilter"
        type="search"
        placeholder="Search card name..."
      >

    </div>

    <div class="filter-holder">

      <span class="filter-label">

      </span>

      <div id="listFilter"></div>

    </div>

    <div class="filter-holder">

      <span class="filter-label">
        Responsible
      </span>

      <div id="responsibleFilter"></div>

    </div>

    <div class="filter-holder">

      <span class="filter-label">

      </span>

      <div id="labelFilter"></div>

    </div>

    <div class="filter-holder">

      <span class="filter-label">

      </span>

      <div id="statusFilter"></div>

    <button
      id="clearFilters"

    >
      Clear Filters
    </button>

    <div class="legend">

      <div class="legend-item">
        <span class="legend-current"></span>
        Current
      </div>

      <div class="legend-item">

        Baseline
      </div>

      <div class="legend-item">
        <span class="legend-due"></span>
        Due soon
      </div>

        <span class="legend-overdue"></span>
        Overdue
      </div>

    </div>

  </div>

  <div
    id="summary"
    class="summary"
  >
    Loading Trello data...
  </div>

  <div class="timeline-shell">

      id="timeline"
      class="timeline-grid"

      <div class="message">

      </div>

  </div>

</div>

<script src="https://p.trellocdn.com/power-up.min.js"></script>

<script>
  const TRELLO_API_KEY =
    "b82c41f13fc90820cc581fe1c8ecb160";

  const t =
    window.TrelloPowerUp.iframe({
      appKey: TRELLO_API_KEY,
      appName: "Project Timeline",
      appAuthor: "Steph Cluff Marketing Agency"
    });

  const CONFIG = {
    baselineStartField: "Baseline Start",
    baselineFinishField: "Baseline Finish",
    responsibleField: "Responsible",

    dueSoonWorkingDays: 5,

    dayWidth: 42,

    timelinePaddingWorkingDays: 5
  };


  /* ======================================================
     DATA
  ====================================================== */

  let boardData = null;

  let listData = [];

  let cardData = [];

  let customFieldsById = {};

  let processedCards = [];

  let workingDays = [];

  let startDate = null;

  let endDate = null;


  /* ======================================================
     MULTI FILTER STATE
  ====================================================== */

  const multiSelections = {
    list: new Set(),
    responsible: new Set(),
    label: new Set(),
    status: new Set()
  };

  const multiFilterMeta = {};


  /* ======================================================
     DATES
  ====================================================== */

  function parseDateOnly(value) {

    if (!value) {
      return null;
    }

    if (value instanceof Date) {

      return new Date(
        value.getFullYear(),
        value.getMonth(),
        value.getDate()
      );

    }

    const parts =
      String(value)
        .substring(0, 10)
        .split("-");

    if (parts.length !== 3) {
      return null;
    }

    return new Date(
      Number(parts[0]),
      Number(parts[1]) - 1,
      Number(parts[2])
    );

  }


  function cloneDate(date) {

    return new Date(
      date.getFullYear(),
      date.getMonth(),
      date.getDate()
    );

  }


  function addCalendarDays(
    date,
    amount
  ) {

    const result =
      cloneDate(date);

    result.setDate(
      result.getDate() + amount
    );

    return result;

  }


  function isWeekend(date) {

    return (
      date.getDay() === 0 ||
      date.getDay() === 6
    );

  }


  function nextWorkingDay(date) {

    let result =
      cloneDate(date);

    while (isWeekend(result)) {

      result =
        addCalendarDays(
          result,
          1
        );

    }

    return result;

  }


  function previousWorkingDay(date) {

    let result =
      cloneDate(date);

    while (isWeekend(result)) {

      result =
        addCalendarDays(
          result,
          -1
        );

    }

    return result;

  }


  function addWorkingDays(
    date,
    amount
  ) {

    let result =
      cloneDate(date);

    const direction =
      amount >= 0
        ? 1
        : -1;

    let remaining =
      Math.abs(amount);

    while (remaining > 0) {

      result =
        addCalendarDays(
          result,
          direction
        );

      if (!isWeekend(result)) {
        remaining--;
      }

    }

    return result;

  }


  function workingDaysBetween(
    start,
    end
  ) {

    if (!start || !end) {
      return null;
    }

    if (end < start) {

      return -workingDaysBetween(
        end,
        start
      );

    }

    let cursor =
      cloneDate(start);

    let count = 0;

    while (cursor < end) {

      cursor =
        addCalendarDays(
          cursor,
          1
        );

      if (!isWeekend(cursor)) {
        count++;
      }

    }

    return count;

  }


  function dateKey(date) {

    return [
      date.getFullYear(),
      String(
        date.getMonth() + 1
      ).padStart(2, "0"),
      String(
        date.getDate()
      ).padStart(2, "0")
    ].join("-");

  }


  function formatShortDate(date) {

    if (!date) {
      return "";
    }

    return date.toLocaleDateString(
      "en-AU",
      {
        day: "numeric",
        month: "short"
      }
    );

  }


  /* ======================================================
     HELPERS
  ====================================================== */

  function escapeHTML(value) {

    return String(value || "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function uniqueSorted(values) {

    return Array
      .from(
        new Set(
          values.filter(Boolean)
        )
      )
      .sort(
        function(a, b) {

          return String(a)
            .localeCompare(
              String(b),
              undefined,
              {
                numeric: true,
                sensitivity: "base"
              }
            );

        }
      );

  }


  function hasSelections(key) {

    return Boolean(
      multiSelections[key] &&
      multiSelections[key].size
    );

  }


  /* ======================================================
     TRELLO LABEL COLOURS
  ====================================================== */

  function getLabelColours(color) {

    const palette = {

      green: [
        "#4BCE97",
        "#164B35"
      ],

      yellow: [
        "#F5CD47",
        "#533F04"
      ],

      orange: [
        "#FEA362",
        "#702E00"
      ],

      red: [
        "#F87168",
        "#5D1F1A"
      ],

      purple: [
        "#9F8FEF",
        "#352C63"
      ],

      blue: [
        "#579DFF",
        "#09326C"
      ],

      sky: [
        "#6CC3E0",
        "#164555"
      ],

      lime: [
        "#94C748",
        "#37471F"
      ],

      pink: [
        "#E774BB",
        "#50253F"
      ],

      black: [
        "#8590A2",
        "#172B4D"
      ]

    };

    const key =
      String(color || "")
        .replace(
          /_(light|dark)$/,
          ""
        );

    return (
      palette[key] ||
      [
        "#DFE1E6",
        "#172B4D"
      ]
    );

  }


  function labelStyle(color) {

    const colours =
      getLabelColours(color);

    return (
      "background-color:" +
      colours[0] +
      ";" +
      "color:" +
      colours[1] +
      ";"
    );

  }


  /* ======================================================
     CUSTOM FIELDS
  ====================================================== */

  function buildCustomFieldMap() {

    customFieldsById = {};

    (
      boardData.customFields ||
      []
    )
      .forEach(
        function(field) {

          customFieldsById[field.id] =
            field;

        }
      );

  }


  function resolveCustomFieldValue(
    card,
    fieldName
  ) {

    const definition =
      Object
        .values(
          customFieldsById
        )
        .find(
          function(field) {

            return (
              field.name
                .trim()
                .toLowerCase() ===
              fieldName
                .trim()
                .toLowerCase()
            );

          }
        );

    if (!definition) {
      return "";
    }

    const item =
      (
        card.customFieldItems ||
        []
      )
        .find(
          function(customItem) {

            return (
              customItem.idCustomField ===
              definition.id
            );

          }
        );

    if (!item) {
      return "";
    }

    if (
      definition.type === "list" &&
      item.idValue
    ) {

      const option =
        (
          definition.options ||
          []
        )
          .find(
            function(option) {

              return (
                option.id ===
                item.idValue
              );

            }
          );

      return (
        option &&
        option.value
      )
        ? option.value.text || ""
        : "";

    }

    if (
      item.value &&
      item.value.date
    ) {

      return item.value.date;

    }

    if (
      item.value &&
      typeof item.value.text !==
      "undefined"
    ) {

      return item.value.text;

    }

    if (
      item.value &&
      typeof item.value.number !==
      "undefined"
    ) {

      return item.value.number;

    }

    if (
      item.value &&
      typeof item.value.checked !==
      "undefined"
    ) {

      return (
        item.value.checked ===
        "true"
      )
        ? "Yes"
        : "No";

    }

    return "";

  }


  /* ======================================================
     PROCESS CARDS
  ====================================================== */

  function processCards() {

    const today =
      parseDateOnly(
        new Date()
      );

    processedCards =
      cardData
        .map(
          function(card) {

            const currentStart =
              parseDateOnly(
                card.start
              );

            const currentDue =
              parseDateOnly(
                card.due
              );

            const baselineStart =
              parseDateOnly(
                resolveCustomFieldValue(
                  card,
                  CONFIG.baselineStartField
                )
              );

            const baselineFinish =
              parseDateOnly(
                resolveCustomFieldValue(
                  card,
                  CONFIG.baselineFinishField
                )
              );

            const responsible =
              resolveCustomFieldValue(
                card,
                CONFIG.responsibleField
              );

            let status =
              "normal";

            if (card.dueComplete) {

              status =
                "complete";

            } else if (
              currentDue &&
              currentDue < today
            ) {

              status =
                "overdue";

            } else if (currentDue) {

              const remaining =
                workingDaysBetween(
                  today,
                  currentDue
                );

              if (
                remaining >= 0 &&
                remaining <=
                  CONFIG.dueSoonWorkingDays
              ) {

                status =
                  "due-soon";

              }

            }

            const baselineExceeded =
              Boolean(
                currentDue &&
                baselineFinish &&
                currentDue >
                  baselineFinish
              );

            const variance =
              (
                currentDue &&
                baselineFinish
              )
                ? workingDaysBetween(
                    baselineFinish,
                    currentDue
                  )
                : null;

            const list =
              listData.find(
                function(item) {

                  return (
                    item.id ===
                    card.idList
                  );

                }
              );

            return {
              ...card,

              listName:
                list
                  ? list.name
                  : "Other",

              currentStart,

              currentDue,

              baselineStart,

              baselineFinish,

              responsible,

              status,

              baselineExceeded,

              variance
            };

          }
        )
        .filter(
          function(card) {

            return Boolean(
              (
                card.currentStart &&
                card.currentDue
              )
              ||
              (
                card.baselineStart &&
                card.baselineFinish
              )
            );

          }
        );

  }


  /* ======================================================
     TIMELINE RANGE
  ====================================================== */

  function calculateRange(cards) {

    const dates = [];

    cards.forEach(
      function(card) {

        [
          card.currentStart,
          card.currentDue,
          card.baselineStart,
          card.baselineFinish
        ]
          .forEach(
            function(date) {

              if (date) {
                dates.push(date);
              }

            }
          );

      }
    );

    if (!dates.length) {

      startDate = null;
      endDate = null;

      return;

    }

    dates.sort(
      function(a, b) {
        return a - b;
      }
    );

    startDate =
      addWorkingDays(
        dates[0],
        -CONFIG.timelinePaddingWorkingDays
      );

    endDate =
      addWorkingDays(
        dates[
          dates.length - 1
        ],
        CONFIG.timelinePaddingWorkingDays
      );

    startDate =
      previousWorkingDay(
        startDate
      );

    endDate =
      nextWorkingDay(
        endDate
      );

  }


  function buildWorkingDays() {

    workingDays = [];

    if (
      !startDate ||
      !endDate
    ) {
      return;
    }

    let cursor =
      cloneDate(
        startDate
      );

    while (
      cursor <= endDate
    ) {

      if (
        !isWeekend(cursor)
      ) {

        workingDays.push(
          cloneDate(cursor)
        );

      }

      cursor =
        addCalendarDays(
          cursor,
          1
        );

    }

  }


  /* ======================================================
     POSITIONING
  ====================================================== */

  function getDateIndex(
    date,
    type
  ) {

    if (
      !date ||
      !workingDays.length
    ) {
      return null;
    }

    const adjusted =
      type === "end"
        ? previousWorkingDay(date)
        : nextWorkingDay(date);

    if (
      adjusted <
      workingDays[0]
    ) {
      return 0;
    }

    if (
      adjusted >
      workingDays[
        workingDays.length - 1
      ]
    ) {

      return (
        workingDays.length - 1
      );

    }

    return workingDays
      .findIndex(
        function(item) {

          return (
            dateKey(item) ===
            dateKey(adjusted)
          );

        }
      );

  }


  function getBarGeometry(
    start,
    end
  ) {

    if (!start || !end) {
      return null;
    }

    let startIndex =
      getDateIndex(
        start,
        "start"
      );

    let endIndex =
      getDateIndex(
        end,
        "end"
      );

    if (
      startIndex === null ||
      endIndex === null ||
      startIndex < 0 ||
      endIndex < 0
    ) {
      return null;
    }

    if (
      endIndex <
      startIndex
    ) {

      const temp =
        startIndex;

      startIndex =
        endIndex;

      endIndex =
        temp;

    }

    return {
      left:
        startIndex *
        CONFIG.dayWidth,

      width:
        (
          endIndex -
          startIndex +
          1
        ) *
        CONFIG.dayWidth
    };

  }


  /* ======================================================
     MULTI FILTER COMPONENT
  ====================================================== */

  function buildMultiFilter(config) {

    const container =
      document.getElementById(
        config.containerId
      );

    if (!container) {
      return;
    }

    container.innerHTML = "";

    const key =
      config.key;

    multiSelections[key] =
      new Set();

    multiFilterMeta[key] = {
      allLabel:
        config.allLabel,

      singularLabel:
        config.singularLabel,

      pluralLabel:
        config.pluralLabel,

      values:
        config.values
    };

    const wrapper =
      document.createElement(
        "div"
      );

    wrapper.className =
      "multi-filter";

    wrapper.dataset.key =
      key;

    const button =
      document.createElement(
        "button"
      );

    button.type =
      "button";

    button.className =
      "multi-filter-button";

    const buttonText =
      document.createElement(
        "span"
      );

    buttonText.className =
      "multi-filter-button-text";

    buttonText.textContent =
      config.allLabel;

    const arrow =
      document.createElement(
        "span"
      );

    arrow.className =
      "multi-filter-arrow";

    arrow.textContent =
      "▼";

    button.appendChild(
      buttonText
    );

    button.appendChild(
      arrow
    );

    const menu =
      document.createElement(
        "div"
      );

    menu.className =
      "multi-filter-menu";

    const actions =
      document.createElement(
        "div"
      );

    actions.className =
      "multi-filter-actions";

    const selectAllButton =
      document.createElement(
        "button"
      );

    selectAllButton.type =
      "button";

    selectAllButton.textContent =
      "Select all";

    const clearButton =
      document.createElement(
        "button"
      );

    clearButton.type =
      "button";

    clearButton.textContent =
      "Clear";

    actions.appendChild(
      selectAllButton
    );

    actions.appendChild(
      clearButton
    );

    const options =
      document.createElement(
        "div"
      );

    options.className =
      "multi-filter-options";

    config.values.forEach(
      function(optionData) {

        const value =
          typeof optionData ===
          "object"
            ? optionData.value
            : optionData;

        const displayText =
          typeof optionData ===
          "object"
            ? optionData.label
            : optionData;

        const row =
          document.createElement(
            "label"
          );

        row.className =
          "multi-filter-option";

        const checkbox =
          document.createElement(
            "input"
          );

        checkbox.type =
          "checkbox";

        checkbox.value =
          value;

        checkbox.dataset.filterKey =
          key;

        if (
          typeof optionData ===
            "object" &&
          optionData.color
        ) {

          const swatch =
            document.createElement(
              "span"
            );

          swatch.className =
            "filter-label-swatch";

          const colours =
            getLabelColours(
              optionData.color
            );

          swatch.style
            .backgroundColor =
              colours[0];

          row.appendChild(
            checkbox
          );

          row.appendChild(
            swatch
          );

        } else {

          row.appendChild(
            checkbox
          );

        }

        const text =
          document.createElement(
            "span"
          );

        text.className =
          "multi-filter-option-text";

        text.textContent =
          displayText;

        row.appendChild(
          text
        );

        options.appendChild(
          row
        );

        checkbox
          .addEventListener(
            "change",
            function() {

              if (
                checkbox.checked
              ) {

                multiSelections[key]
                  .add(value);

              } else {

                multiSelections[key]
                  .delete(value);

              }

              refreshMultiFilterButton(
                key
              );

              renderTimeline();

            }
          );

      }
    );

    menu.appendChild(
      actions
    );

    menu.appendChild(
      options
    );

    wrapper.appendChild(
      button
    );

    wrapper.appendChild(
      menu
    );

    container.appendChild(
      wrapper
    );

    button.addEventListener(
      "click",
      function(event) {

        event.stopPropagation();

        const shouldOpen =
          !wrapper.classList
            .contains(
              "open"
            );

        closeAllMultiFilters();

        if (shouldOpen) {

          wrapper.classList
            .add(
              "open"
            );

        }

      }
    );

    menu.addEventListener(
      "click",
      function(event) {

        event.stopPropagation();

      }
    );

    selectAllButton
      .addEventListener(
        "click",
        function() {

          multiSelections[key] =
            new Set(
              config.values.map(
                function(optionData) {

                  return (
                    typeof optionData ===
                    "object"
                  )
                    ? optionData.value
                    : optionData;

                }
              )
            );

          wrapper
            .querySelectorAll(
              'input[type="checkbox"]'
            )
            .forEach(
              function(checkbox) {

                checkbox.checked =
                  true;

              }
            );

          refreshMultiFilterButton(
            key
          );

          renderTimeline();

        }
      );

    clearButton
      .addEventListener(
        "click",
        function() {

          clearMultiFilter(
            key,
            wrapper
          );

          renderTimeline();

        }
      );

  }


  function refreshMultiFilterButton(key) {

    const wrapper =
      document.querySelector(
        '.multi-filter[data-key="' +
        key +
        '"]'
      );

    if (!wrapper) {
      return;
    }

    const button =
      wrapper.querySelector(
        ".multi-filter-button"
      );

    const text =
      wrapper.querySelector(
        ".multi-filter-button-text"
      );

    const selected =
      Array.from(
        multiSelections[key] ||
        []
      );

    const meta =
      multiFilterMeta[key];

    if (!selected.length) {

      text.textContent =
        meta.allLabel;

      button.classList
        .remove(
          "active"
        );

      return;

    }

    button.classList
      .add(
        "active"
      );

    if (
      selected.length === 1
    ) {

      const selectedValue =
        selected[0];

      const source =
        meta.values.find(
          function(item) {

            const value =
              typeof item ===
              "object"
                ? item.value
                : item;

            return (
              value ===
              selectedValue
            );

          }
        );

      text.textContent =
        (
          source &&
          typeof source ===
          "object"
        )
          ? source.label
          : selectedValue;

      return;

    }

    text.textContent =
      selected.length +
      " " +
      meta.pluralLabel +
      " selected";

  }


  function clearMultiFilter(
    key,
    wrapper
  ) {

    multiSelections[key]
      .clear();

    wrapper
      .querySelectorAll(
        'input[type="checkbox"]'
      )
      .forEach(
        function(checkbox) {

          checkbox.checked =
            false;

        }
      );

    refreshMultiFilterButton(
      key
    );

  }


  function closeAllMultiFilters() {

    document
      .querySelectorAll(
        ".multi-filter.open"
      )
      .forEach(
        function(filter) {

          filter.classList
            .remove(
              "open"
            );

        }
      );

  }


  /* ======================================================
     BUILD FILTERS
  ====================================================== */

  function buildFilters() {

    buildMultiFilter({
      containerId:
        "listFilter",

      key:
        "list",

      allLabel:
        "All Lists",

      singularLabel:
        "List",

      pluralLabel:
        "Lists",

      values:
        listData.map(
          function(list) {

            return {
              value: list.id,
              label: list.name
            };

          }
        )
    });


    buildMultiFilter({
      containerId:
        "responsibleFilter",

      key:
        "responsible",

      allLabel:
        "All Responsible",

      singularLabel:
        "Responsible",

      pluralLabel:
        "Responsible",

      values:
        uniqueSorted(
          processedCards
            .map(
              function(card) {

                return card.responsible;

              }
            )
            .filter(Boolean)
        )
    });


    const labelMap =
      new Map();

    processedCards
      .forEach(
        function(card) {

          (
            card.labels ||
            []
          )
            .forEach(
              function(label) {

                if (!label.id) {
                  return;
                }

                labelMap.set(
                  label.id,
                  {
                    value: label.id,
                    label:
                      label.name ||
                      label.color ||
                      "Unnamed label",
                    color:
                      label.color || ""
                  }
                );

              }
            );

        }
      );

    const labels =
      Array.from(
        labelMap.values()
      )
        .sort(
          function(a, b) {

            return a.label
              .localeCompare(
                b.label,
                undefined,
                {
                  numeric: true,
                  sensitivity: "base"
                }
              );

          }
        );

    buildMultiFilter({
      containerId:
        "labelFilter",

      key:
        "label",

      allLabel:
        "All Labels",

      singularLabel:
        "Label",

      pluralLabel:
        "Labels",

      values:
        labels
    });


    buildMultiFilter({
      containerId:
        "statusFilter",

      key:
        "status",

      allLabel:
        "All Statuses",

      singularLabel:
        "Status",

      pluralLabel:
        "Statuses",

      values: [
        {
          value: "normal",
          label: "On track"
        },
        {
          value: "due-soon",
          label: "Due soon"
        },
        {
          value: "overdue",
          label: "Overdue"
        },
        {
          value: "baseline-exceeded",
          label: "Baseline exceeded"
        },
        {
          value: "complete",
          label: "Complete"
        }
      ]
    });

  }


  /* ======================================================
     FILTERING
  ====================================================== */

  function getFilteredCards() {

    const search =
      document
        .getElementById(
          "searchFilter"
        )
        .value
        .trim()
        .toLowerCase();

    return processedCards
      .filter(
        function(card) {

          if (
            search &&
            !card.name
              .toLowerCase()
              .includes(search)
          ) {

            return false;

          }

          if (
            hasSelections("list") &&
            !multiSelections.list
              .has(
                card.idList
              )
          ) {

            return false;

          }

          if (
            hasSelections(
              "responsible"
            ) &&
            !multiSelections.responsible
              .has(
                card.responsible
              )
          ) {

            return false;

          }

          if (
            hasSelections("label")
          ) {

            const matched =
              (
                card.labels ||
                []
              )
                .some(
                  function(label) {

                    return (
                      multiSelections.label
                        .has(
                          label.id
                        )
                    );

                  }
                );

            if (!matched) {
              return false;
            }

          }

          if (
            hasSelections("status")
          ) {

            const matches =
              Array
                .from(
                  multiSelections.status
                )
                .some(
                  function(selectedStatus) {

                    if (
                      selectedStatus ===
                      "baseline-exceeded"
                    ) {

                      return (
                        card.baselineExceeded
                      );

                    }

                    return (
                      card.status ===
                      selectedStatus
                    );

                  }
                );

            if (!matches) {
              return false;
            }

          }

          return true;

        }
      );

  }


  /* ======================================================
     HEADERS
  ====================================================== */

  function renderMonthHeader() {

    const groups = [];

    workingDays
      .forEach(
        function(date, index) {

          const key =
            date.getFullYear() +
            "-" +
            date.getMonth();

          let group =
            groups.find(
              function(item) {

                return (
                  item.key === key
                );

              }
            );

          if (!group) {

            group = {
              key: key,

              label:
                date.toLocaleDateString(
                  "en-AU",
                  {
                    month: "long",
                    year: "numeric"
                  }
                ),

              start:
                index,

              count:
                0
            };

            groups.push(
              group
            );

          }

          group.count++;

        }
      );

    return groups
      .map(
        function(group) {

          return `
            <div
              class="month-label"
              style="
                left:${group.start * CONFIG.dayWidth}px;
                width:${group.count * CONFIG.dayWidth}px;
              "
            >
              ${escapeHTML(group.label)}
            </div>
          `;

        }
      )
      .join("");

  }


  function renderDayHeader() {

    return workingDays
      .map(
        function(date, index) {

          const weekday =
            date
              .toLocaleDateString(
                "en-AU",
                {
                  weekday: "short"
                }
              )
              .substring(0, 1);

          return `
            <div
              class="day"
              style="
                left:${index * CONFIG.dayWidth}px;
              "
            >
              ${weekday}

              <strong>
                ${date.getDate()}
              </strong>
            </div>
          `;

        }
      )
      .join("");

  }


  function renderTodayMarker(
    headerOnly
  ) {

    const today =
      parseDateOnly(
        new Date()
      );

    if (
      !workingDays.length ||
      today <
        workingDays[0] ||
      today >
        workingDays[
          workingDays.length - 1
        ]
    ) {

      return "";

    }

    const index =
      getDateIndex(
        today,
        "start"
      );

    if (index < 0) {
      return "";
    }

    const left =
      (
        index *
        CONFIG.dayWidth
      ) +
      (
        CONFIG.dayWidth /
        2
      );

    if (headerOnly) {

      return `
        <div
          class="today-label"
          style="left:${left}px"
        >
          TODAY
        </div>
      `;

    }

    return `
      <div
        class="today-line"
        style="left:${left}px"
      ></div>
    `;

  }


  function renderHeader() {

    const width =
      workingDays.length *
      CONFIG.dayWidth;

    return `
      <div class="timeline-header">

        <div
          class="timeline-left header-left"
        >
          Activity
        </div>

        <div
          class="header-track"
          style="width:${width}px"
        >

          <div class="months">
            ${renderMonthHeader()}
          </div>

          <div class="days">
            ${renderDayHeader()}
            ${renderTodayMarker(true)}
          </div>

        </div>

      </div>
    `;

  }


  /* ======================================================
     STATUS
  ====================================================== */

  function statusText(card) {

    if (
      card.status ===
      "overdue"
    ) {
      return "⚑ OVERDUE";
    }

    if (
      card.status ===
      "due-soon"
    ) {
      return "⚑ DUE SOON";
    }

    if (
      card.status ===
      "complete"
    ) {
      return "✓ COMPLETE";
    }

    if (
      card.baselineExceeded &&
      card.variance > 0
    ) {

      return (
        "+" +
        card.variance +
        "d BASELINE"
      );

    }

    return "";

  }


  /* ======================================================
     CARD ROW
  ====================================================== */

  function renderCardRow(card) {

    const current =
      getBarGeometry(
        card.currentStart,
        card.currentDue
      );

    const baseline =
      getBarGeometry(
        card.baselineStart,
        card.baselineFinish
      );

    const trackWidth =
      workingDays.length *
      CONFIG.dayWidth;


    const leftLabels =
      (
        card.labels ||
        []
      )
        .slice(0, 3)
        .map(
          function(label) {

            return `
              <span
                class="label-chip"
                style="${labelStyle(label.color)}"
              >
                ${escapeHTML(
                  label.name ||
                  label.color ||
                  "Label"
                )}
              </span>
            `;

          }
        )
        .join("");


    const barLabels =
      (
        card.labels ||
        []
      )
        .slice(0, 2)
        .map(
          function(label) {

            return `
              <span
                class="activity-label"
                style="${labelStyle(label.color)}"
              >
                ${escapeHTML(
                  label.name ||
                  label.color ||
                  "Label"
                )}
              </span>
            `;

          }
        )
        .join("");


    let currentHTML = "";

    if (current) {

      const tooltip = [
        card.name,

        card.currentStart
          ? (
              "Start: " +
              formatShortDate(
                card.currentStart
              )
            )
          : "",

        card.currentDue
          ? (
              "Due: " +
              formatShortDate(
                card.currentDue
              )
            )
          : "",

        card.baselineStart
          ? (
              "Baseline Start: " +
              formatShortDate(
                card.baselineStart
              )
            )
          : "",

        card.baselineFinish
          ? (
              "Baseline Finish: " +
              formatShortDate(
                card.baselineFinish
              )
            )
          : ""
      ]
        .filter(Boolean)
        .join(" | ");

      currentHTML = `
        <div
          class="activity ${card.status}"
          data-card-id="${card.id}"
          style="
            left:${current.left}px;
            width:${current.width}px;
          "
          title="${escapeHTML(tooltip)}"
        >

          <div class="activity-title">
            ${escapeHTML(card.name)}
          </div>

          <div class="activity-bottom">

            ${barLabels}

            ${
              statusText(card)
                ? `
                  <span class="status-badge">
                    ${escapeHTML(
                      statusText(card)
                    )}
                  </span>
                `
                : ""
            }

          </div>

        </div>
      `;

    }


    let baselineHTML = "";

    if (baseline) {

      baselineHTML = `
        <div
          class="baseline"
          style="
            left:${baseline.left}px;
            width:${baseline.width}px;
          "
          title="${escapeHTML(
            "Baseline: " +
            formatShortDate(
              card.baselineStart
            ) +
            " – " +
            formatShortDate(
              card.baselineFinish
            )
          )}"
        ></div>
      `;

    }


    return `
      <div class="timeline-row">

        <div
          class="card-info"
          data-card-id="${card.id}"
        >

          <div class="card-title">
            ${escapeHTML(card.name)}
          </div>

          <div class="card-meta">
            ${leftLabels}
          </div>

          ${
            card.responsible
              ? `
                <div class="responsible">
                  Responsible:
                  <strong>
                    ${escapeHTML(
                      card.responsible
                    )}
                  </strong>
                </div>
              `
              : ""
          }

        </div>

        <div
          class="track"
          style="
            width:${trackWidth}px;
          "
        >

          ${renderTodayMarker(false)}

          ${currentHTML}

          ${baselineHTML}

        </div>

      </div>
    `;

  }


  /* ======================================================
     RENDER
  ====================================================== */

  function renderTimeline() {

    const filtered =
      getFilteredCards();

    const timeline =
      document.getElementById(
        "timeline"
      );

    const summary =
      document.getElementById(
        "summary"
      );

    if (
      !processedCards.length
    ) {

      timeline.innerHTML = `
        <div class="message">
          No cards with current or Baseline dates were found.
        </div>
      `;

      summary.textContent =
        "No timeline activities found.";

      return;

    }

    const width =
      workingDays.length *
      CONFIG.dayWidth;

    let html =
      renderHeader();

    listData
      .forEach(
        function(list) {

          const cards =
            filtered.filter(
              function(card) {

                return (
                  card.idList ===
                  list.id
                );

              }
            );

          if (!cards.length) {
            return;
          }

          html += `
            <div class="list-row">

              <div class="list-title">
                ${escapeHTML(list.name)}
              </div>

              <div
                class="list-track"
                style="
                  width:${width}px;
                "
              ></div>

            </div>
          `;

          cards.forEach(
            function(card) {

              html +=
                renderCardRow(card);

            }
          );

        }
      );

    timeline.style
      .setProperty(
        "--timeline-width",
        width + "px"
      );

    timeline.innerHTML =
      html;

    summary.textContent =
      filtered.length +
      " of " +
      processedCards.length +
      " activities shown";

    bindCardClicks();

  }


  /* ======================================================
     OPEN CARD
  ====================================================== */

  function bindCardClicks() {

  document
    .querySelectorAll(
      "[data-card-id]"
    )
    .forEach(
      function(element) {

        element.addEventListener(
          "click",
          function(event) {

            event.preventDefault();
            event.stopPropagation();

            const cardId =
              this.dataset.cardId;

            if (!cardId) {
              return;
            }

            const card =
              cardData.find(
                function(item) {
                  return item.id === cardId;
                }
              );

            if (
              card &&
              card.url
            ) {

              window.open(
                card.url,
                "_blank",
                "noopener,noreferrer"
              );

            }

          }
        );

      }
    );

}


  /* ======================================================
     CLEAR FILTERS
  ====================================================== */

  function clearFilters() {

    document
      .getElementById(
        "searchFilter"
      )
      .value = "";

    Object
      .keys(
        multiSelections
      )
      .forEach(
        function(key) {

          multiSelections[key]
            .clear();

        }
      );

    document
      .querySelectorAll(
        '.multi-filter input[type="checkbox"]'
      )
      .forEach(
        function(checkbox) {

          checkbox.checked =
            false;

        }
      );

    Object
      .keys(
        multiSelections
      )
      .forEach(
        function(key) {

          refreshMultiFilterButton(
            key
          );

        }
      );

    closeAllMultiFilters();

    renderTimeline();

  }


  /* ======================================================
     LOAD TRELLO
  ====================================================== */

  async function loadData() {

    try {

      const restApi =
        await t.getRestApi();

      const authorized =
        await restApi
          .isAuthorized();

      if (!authorized) {

        document
          .getElementById(
            "timeline"
          )
          .innerHTML = `
            <div class="message">

              <p>
                Project Timeline needs permission to read this Trello board.
              </p>

              <button
                id="authorizeTrello"
                class="authorize-button"
                type="button"
              >
                Authorize Trello
              </button>

            </div>
          `;

        document
          .getElementById(
            "summary"
          )
          .textContent =
            "Authorization required.";

        document
          .getElementById(
            "authorizeTrello"
          )
          .addEventListener(
            "click",
            async function() {

              try {

                await restApi
                  .authorize({
                    scope: "read",
                    expiration: "never"
                  });

                window.location.reload();

              } catch (error) {

                console.error(
                  "Trello authorization failed:",
                  error
                );

              }

            }
          );

        return;

      }


      const basicBoard =
        await t.board(
          "id",
          "name"
        );

      const token =
        await restApi
          .getToken();

      const boardId =
        basicBoard.id;

      const key =
        TRELLO_API_KEY;


      const boardResponse =
        await fetch(
          "https://api.trello.com/1/boards/" +
          boardId +
          "?fields=id,name" +
          "&customFields=true" +
          "&key=" +
          encodeURIComponent(key) +
          "&token=" +
          encodeURIComponent(token)
        );

      if (!boardResponse.ok) {
        throw new Error(
          "Board request failed."
        );
      }

      boardData =
        await boardResponse.json();


      const listsResponse =
        await fetch(
          "https://api.trello.com/1/boards/" +
          boardId +
          "/lists" +
          "?fields=id,name" +
          "&key=" +
          encodeURIComponent(key) +
          "&token=" +
          encodeURIComponent(token)
        );

      if (!listsResponse.ok) {
        throw new Error(
          "List request failed."
        );
      }

      listData =
        await listsResponse.json();


      const cardsResponse =
        await fetch(
          "https://api.trello.com/1/boards/" +
          boardId +
          "/cards" +
          "?fields=id,name,start,due,dueComplete,idList,url,labels" +
          "&customFieldItems=true" +
          "&key=" +
          encodeURIComponent(key) +
          "&token=" +
          encodeURIComponent(token)
        );

      if (!cardsResponse.ok) {
        throw new Error(
          "Card request failed."
        );
      }

      cardData =
        await cardsResponse.json();


      buildCustomFieldMap();

      processCards();

      calculateRange(
        processedCards
      );

      buildWorkingDays();

      buildFilters();

      renderTimeline();


    } catch (error) {

      console.error(error);

      document
        .getElementById(
          "timeline"
        )
        .innerHTML = `
          <div class="message error">
            Could not load the Trello timeline.
          </div>
        `;

      document
        .getElementById(
          "summary"
        )
        .textContent =
          "Timeline failed to load.";

    }

  }


  /* ======================================================
     EVENTS
  ====================================================== */

  document
    .getElementById(
      "searchFilter"
    )
    .addEventListener(
      "input",
      renderTimeline
    );


  document
    .getElementById(
      "clearFilters"
    )
    .addEventListener(
      "click",
      clearFilters
    );


  document
    .addEventListener(
      "click",
      function() {

        closeAllMultiFilters();

      }
    );


  document
    .addEventListener(
      "keydown",
      function(event) {

        if (
          event.key ===
          "Escape"
        ) {

          closeAllMultiFilters();

        }

      }
    );


  /* ======================================================
     START
  ====================================================== */

  loadData();
</script>

</body>
</html>
