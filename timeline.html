<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Timeline</title>

  <style>
    :root {
      --governor: #434E46;
      --moss: #A6BDA6;
      --mahogany: #4E1C11;
      --espresso: #2C1511;
      --ivory: #FFFBF2;
      --brass: #887255;

      --due-soon: #FFF4CC;
      --overdue: #F8D7D2;
      --border: #D9DDE3;
      --text: #172B4D;
      --muted: #6B778C;

      --day-width: 42px;
      --left-width: 310px;
      --row-height: 72px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: #F7F8FA;
    }

    .page {
      padding: 18px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: end;

      background: white;
      border: 1px solid var(--border);
      border-radius: 10px;

      padding: 14px;
      margin-bottom: 12px;
    }

    .filter {
      min-width: 160px;
    }

    .filter.search {
      min-width: 240px;
      flex: 1;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 5px;
    }

    input,
    select {
      width: 100%;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0 10px;
      background: white;
    }

    .multi-filter {
  position: relative;
  min-width: 180px;
}

.multi-filter summary {
  height: 36px;
  display: flex;
  align-items: center;

  padding: 0 10px;

  border: 1px solid var(--border);
  border-radius: 6px;

  background: white;
  cursor: pointer;

  font-size: 13px;

  list-style: none;
}

.multi-filter summary::-webkit-details-marker {
  display: none;
}

.multi-filter summary::after {
  content: "▼";
  margin-left: auto;
  font-size: 10px;
  color: var(--muted);
}

.multi-filter[open] summary {
  border-bottom-left-radius: 0;
  border-bottom-right-radius: 0;
}

.multi-filter-options {
  position: absolute;
  z-index: 50;

  top: 36px;
  left: 0;

  width: 100%;
  min-width: 220px;
  max-height: 260px;

  overflow-y: auto;

  background: white;

  border: 1px solid var(--border);
  border-top: 0;

  border-bottom-left-radius: 6px;
  border-bottom-right-radius: 6px;
}

.multi-option {
  display: flex;
  align-items: center;
  gap: 8px;

  padding: 8px 10px;

  cursor: pointer;
  font-size: 13px;
}

.multi-option:hover {
  background: #F4F5F7;
}

.multi-option input {
  width: auto;
  height: auto;
  margin: 0;
}

.multi-option-label {
  flex: 1;
}

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-left: auto;
      font-size: 12px;
      color: var(--muted);
      align-items: center;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-current {
      width: 36px;
      height: 14px;
      border-radius: 4px;
      background: var(--moss);
    }

    .legend-baseline {
      width: 36px;
      height: 7px;
      border-radius: 5px;
      background: var(--governor);
    }

    .legend-due {
      width: 15px;
      height: 15px;
      border-radius: 3px;
      background: var(--due-soon);
      border: 1px solid #D6A400;
    }

    .legend-overdue {
      width: 15px;
      height: 15px;
      border-radius: 3px;
      background: var(--overdue);
      border: 1px solid #A63A2B;
    }

    .summary {
      margin-bottom: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    .timeline-shell {
      background: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: auto;
      max-height: calc(100vh - 180px);
    }

    .timeline-grid {
      min-width: max-content;
    }

    .timeline-header,
    .timeline-row,
    .list-row {
      display: grid;
      grid-template-columns: var(--left-width) var(--timeline-width);
    }

    .timeline-left {
      position: sticky;
      left: 0;
      z-index: 6;
      background: white;
      border-right: 1px solid var(--border);
    }

    .header-left {
      height: 72px;
      display: flex;
      align-items: end;
      padding: 14px;
      font-weight: 700;
      border-bottom: 1px solid var(--border);
    }

    .header-track {
      height: 72px;
      position: relative;
      background: white;
      border-bottom: 1px solid var(--border);
    }

    .months {
      height: 32px;
      position: relative;
      border-bottom: 1px solid var(--border);
    }

    .month-label {
      position: absolute;
      top: 0;
      height: 32px;
      padding: 7px 8px;
      border-right: 1px solid var(--border);
      font-size: 12px;
      font-weight: 700;
    }

    .days {
      height: 40px;
      position: relative;
    }

    .day {
      position: absolute;
      top: 0;
      width: var(--day-width);
      height: 40px;
      text-align: center;
      padding-top: 4px;
      border-right: 1px solid #EEF0F2;
      color: var(--muted);
      font-size: 10px;
    }

    .day strong {
      display: block;
      margin-top: 2px;
      color: var(--text);
      font-size: 12px;
    }

    .list-title {
      position: sticky;
      left: 0;
      z-index: 7;
      padding: 9px 14px;
      background: #F1F2F4;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .list-track {
      background: #F1F2F4;
      border-bottom: 1px solid var(--border);
    }

    .timeline-row {
      min-height: var(--row-height);
    }

    .card-info {
      position: sticky;
      left: 0;
      z-index: 5;
      background: white;
      min-height: var(--row-height);
      padding: 9px 12px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .card-info:hover .card-title {
      text-decoration: underline;
    }

    .card-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .label-chip {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 10px;
      background: #ECEEF1;
      font-size: 10px;
      font-weight: 700;
    }

    .responsible {
      margin-top: 5px;
      font-size: 11px;
      color: var(--muted);
    }

    .track {
      position: relative;
      height: var(--row-height);
      border-bottom: 1px solid var(--border);

      background:
        repeating-linear-gradient(
          to right,
          transparent 0,
          transparent calc(var(--day-width) - 1px),
          #F1F3F5 calc(var(--day-width) - 1px),
          #F1F3F5 var(--day-width)
        );
    }

    .activity {
      position: absolute;
      top: 11px;
      height: 43px;
      min-width: 10px;
      overflow: hidden;
      border-radius: 6px;
      background: var(--moss);
      border: 1px solid #8DA78D;
      padding: 5px 7px;
      cursor: pointer;
      z-index: 2;
    }

    .activity.due-soon {
      background: var(--due-soon);
      border-color: #D6A400;
    }

    .activity.overdue {
      background: var(--overdue);
      border-color: #A63A2B;
    }

    .activity.complete {
      opacity: 0.65;
    }

    .activity-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 11px;
      font-weight: 700;
    }

    .activity-bottom {
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      overflow: hidden;
    }

    .activity-label {
      padding: 1px 5px;
      border-radius: 8px;
      background: rgba(255,255,255,0.75);
      font-size: 9px;
      font-weight: 700;
    }

    .status-badge {
      padding: 1px 5px;
      border-radius: 8px;
      background: rgba(255,255,255,0.85);
      font-size: 9px;
      font-weight: 800;
    }

    .baseline {
      position: absolute;
      top: 53px;
      height: 7px;
      border-radius: 5px;
      background: var(--governor);
      z-index: 3;
    }

    .today-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--brass);
      z-index: 4;
      pointer-events: none;
    }

    .today-label {
      position: absolute;
      top: 1px;
      transform: translateX(-50%);
      background: var(--brass);
      color: white;
      border-radius: 4px;
      padding: 2px 5px;
      font-size: 9px;
      font-weight: 800;
      z-index: 10;
    }

    .message {
      padding: 30px;
      color: var(--muted);
      text-align: center;
    }

    .error {
      color: #A63A2B;
    }
  </style>
</head>

<body>

<div class="page">

  <div class="toolbar">

    <div class="filter search">
      <label for="searchFilter">Search activities</label>
      <input
        id="searchFilter"
        type="text"
        placeholder="Search card name..."
      >
    </div>

    <div class="filter">
  <label>List</label>

  <details class="multi-filter" id="listFilter">
    <summary>All lists</summary>

    <div
      class="multi-filter-options"
      id="listFilterOptions">
    </div>
  </details>
</div>

    <div class="filter">
      <label for="responsibleFilter">Responsible</label>
      <select id="responsibleFilter">
        <option value="">Everyone</option>
      </select>
    </div>

    <div class="filter">
      <label for="labelFilter">Label</label>
      <select id="labelFilter">
        <option value="">All labels</option>
      </select>
    </div>

    <div class="filter">
      <label for="statusFilter">Due status</label>
      <select id="statusFilter">
        <option value="">All statuses</option>
        <option value="normal">On track</option>
        <option value="due-soon">Due soon</option>
        <option value="overdue">Overdue</option>
        <option value="baseline-exceeded">Baseline exceeded</option>
        <option value="complete">Complete</option>
      </select>
    </div>

    <div class="legend">
      <div class="legend-item">
        <span class="legend-current"></span>
        Current
      </div>

      <div class="legend-item">
        <span class="legend-baseline"></span>
        Baseline
      </div>

      <div class="legend-item">
        <span class="legend-due"></span>
        Due soon
      </div>

      <div class="legend-item">
        <span class="legend-overdue"></span>
        Overdue
      </div>
    </div>

  </div>

  <div id="summary" class="summary">
    Loading Trello data...
  </div>

  <div class="timeline-shell">
    <div id="timeline" class="timeline-grid">
      <div class="message">
        Loading project timeline...
      </div>
    </div>
  </div>

</div>

<script src="https://p.trellocdn.com/power-up.min.js"></script>

<script>
  /*
    IMPORTANT:
    Paste the SAME Trello API Key you added to index.html.
    Do not paste your API Secret here.
  */

  const TRELLO_API_KEY = "b82c41f13fc90820cc581fe1c8ecb160";

  const t = window.TrelloPowerUp.iframe({
    appKey: TRELLO_API_KEY,
    appName: "Project Timeline",
    appAuthor: "Steph Cluff Marketing Agency"
  });

  const CONFIG = {
    baselineStartField: "Baseline Start",
    baselineFinishField: "Baseline Finish",
    responsibleField: "Responsible",
    dueSoonWorkingDays: 5,
    dayWidth: 42,
    timelinePaddingWorkingDays: 5
  };

  let boardData = null;
  let listData = [];
  let cardData = [];

  let customFieldsById = {};
  let processedCards = [];

  let workingDays = [];
  let startDate = null;
  let endDate = null;

  function parseDateOnly(value) {
    if (!value) return null;

    if (value instanceof Date) {
      return new Date(
        value.getFullYear(),
        value.getMonth(),
        value.getDate()
      );
    }

    const parts = String(value).substring(0, 10).split("-");

    if (parts.length !== 3) return null;

    return new Date(
      Number(parts[0]),
      Number(parts[1]) - 1,
      Number(parts[2])
    );
  }

  function cloneDate(date) {
    return new Date(
      date.getFullYear(),
      date.getMonth(),
      date.getDate()
    );
  }

  function addCalendarDays(date, amount) {
    const result = cloneDate(date);
    result.setDate(result.getDate() + amount);
    return result;
  }

  function isWeekend(date) {
    return date.getDay() === 0 || date.getDay() === 6;
  }

  function nextWorkingDay(date) {
    let result = cloneDate(date);

    while (isWeekend(result)) {
      result = addCalendarDays(result, 1);
    }

    return result;
  }

  function previousWorkingDay(date) {
    let result = cloneDate(date);

    while (isWeekend(result)) {
      result = addCalendarDays(result, -1);
    }

    return result;
  }

  function addWorkingDays(date, amount) {
    let result = cloneDate(date);
    const direction = amount >= 0 ? 1 : -1;
    let remaining = Math.abs(amount);

    while (remaining > 0) {
      result = addCalendarDays(result, direction);

      if (!isWeekend(result)) {
        remaining--;
      }
    }

    return result;
  }

  function workingDaysBetween(start, end) {
    if (!start || !end) return null;

    if (end < start) {
      return -workingDaysBetween(end, start);
    }

    let cursor = cloneDate(start);
    let count = 0;

    while (cursor < end) {
      cursor = addCalendarDays(cursor, 1);

      if (!isWeekend(cursor)) {
        count++;
      }
    }

    return count;
  }

  function dateKey(date) {
    return [
      date.getFullYear(),
      String(date.getMonth() + 1).padStart(2, "0"),
      String(date.getDate()).padStart(2, "0")
    ].join("-");
  }

  function formatShortDate(date) {
    if (!date) return "";

    return date.toLocaleDateString(
      "en-AU",
      {
        day: "numeric",
        month: "short"
      }
    );
  }

  function escapeHTML(value) {
    return String(value || "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function buildCustomFieldMap() {
    customFieldsById = {};

    (boardData.customFields || []).forEach(field => {
      customFieldsById[field.id] = field;
    });
  }

  function resolveCustomFieldValue(card, fieldName) {
    const definition = Object.values(customFieldsById).find(
      field =>
        field.name.trim().toLowerCase() ===
        fieldName.trim().toLowerCase()
    );

    if (!definition) return "";

    const item = (card.customFieldItems || []).find(
      customItem =>
        customItem.idCustomField === definition.id
    );

    if (!item) return "";

    if (definition.type === "list" && item.idValue) {
      const option = (definition.options || []).find(
        option => option.id === item.idValue
      );

      return option?.value?.text || "";
    }

    if (item.value?.date) {
      return item.value.date;
    }

    if (typeof item.value?.text !== "undefined") {
      return item.value.text;
    }

    if (typeof item.value?.number !== "undefined") {
      return item.value.number;
    }

    if (typeof item.value?.checked !== "undefined") {
      return item.value.checked === "true" ? "Yes" : "No";
    }

    return "";
  }

  function processCards() {
    const today = parseDateOnly(new Date());

    processedCards = cardData
      .map(card => {
        const currentStart = parseDateOnly(card.start);
        const currentDue = parseDateOnly(card.due);

        const baselineStart = parseDateOnly(
          resolveCustomFieldValue(
            card,
            CONFIG.baselineStartField
          )
        );

        const baselineFinish = parseDateOnly(
          resolveCustomFieldValue(
            card,
            CONFIG.baselineFinishField
          )
        );

        const responsible = resolveCustomFieldValue(
          card,
          CONFIG.responsibleField
        );

        let status = "normal";

        if (card.dueComplete) {
          status = "complete";
        } else if (currentDue && currentDue < today) {
          status = "overdue";
        } else if (currentDue) {
          const remaining = workingDaysBetween(
            today,
            currentDue
          );

          if (
            remaining >= 0 &&
            remaining <= CONFIG.dueSoonWorkingDays
          ) {
            status = "due-soon";
          }
        }

        const baselineExceeded =
          currentDue &&
          baselineFinish &&
          currentDue > baselineFinish;

        const variance =
          currentDue && baselineFinish
            ? workingDaysBetween(
                baselineFinish,
                currentDue
              )
            : null;

        const list = listData.find(
          item => item.id === card.idList
        );

        return {
          ...card,
          currentStart,
          currentDue,
          baselineStart,
          baselineFinish,
          responsible,
          status,
          baselineExceeded,
          variance,
          listName: list?.name || "Other"
        };
      })
      .filter(card => {
        return (
          (card.currentStart && card.currentDue) ||
          (card.baselineStart && card.baselineFinish)
        );
      });
  }

  function calculateRange(cards) {
    const dates = [];

    cards.forEach(card => {
      [
        card.currentStart,
        card.currentDue,
        card.baselineStart,
        card.baselineFinish
      ].forEach(date => {
        if (date) dates.push(date);
      });
    });

    if (!dates.length) {
      startDate = null;
      endDate = null;
      return;
    }

    dates.sort((a, b) => a - b);

    startDate = addWorkingDays(
      dates[0],
      -CONFIG.timelinePaddingWorkingDays
    );

    endDate = addWorkingDays(
      dates[dates.length - 1],
      CONFIG.timelinePaddingWorkingDays
    );

    startDate = previousWorkingDay(startDate);
    endDate = nextWorkingDay(endDate);
  }

  function buildWorkingDays() {
    workingDays = [];

    if (!startDate || !endDate) return;

    let cursor = cloneDate(startDate);

    while (cursor <= endDate) {
      if (!isWeekend(cursor)) {
        workingDays.push(cloneDate(cursor));
      }

      cursor = addCalendarDays(cursor, 1);
    }
  }

  function getDateIndex(date, type) {
    if (!date || !workingDays.length) return null;

    const adjusted =
      type === "end"
        ? previousWorkingDay(date)
        : nextWorkingDay(date);

    if (adjusted < workingDays[0]) return 0;

    if (adjusted > workingDays[workingDays.length - 1]) {
      return workingDays.length - 1;
    }

    return workingDays.findIndex(
      item => dateKey(item) === dateKey(adjusted)
    );
  }

  function getBarGeometry(start, end) {
    if (!start || !end) return null;

    let startIndex = getDateIndex(start, "start");
    let endIndex = getDateIndex(end, "end");

    if (
      startIndex === null ||
      endIndex === null ||
      startIndex < 0 ||
      endIndex < 0
    ) {
      return null;
    }

    if (endIndex < startIndex) {
      [startIndex, endIndex] = [endIndex, startIndex];
    }

    return {
      left: startIndex * CONFIG.dayWidth,
      width:
        (endIndex - startIndex + 1) *
        CONFIG.dayWidth
    };
  }

  function populateFilters() {
    const listFilter = document.getElementById("listFilter");
    const responsibleFilter =
      document.getElementById("responsibleFilter");
    const labelFilter =
      document.getElementById("labelFilter");

        const listFilterOptions =
      document.getElementById("listFilterOptions");

    listFilterOptions.innerHTML = "";

    listData.forEach(list => {
      const row = document.createElement("label");
      row.className = "multi-option";

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.value = list.id;
      checkbox.dataset.filter = "list";

      const text = document.createElement("span");
      text.className = "multi-option-label";
      text.textContent = list.name;

      row.appendChild(checkbox);
      row.appendChild(text);

      listFilterOptions.appendChild(row);
    });

    [
      ...new Set(
        processedCards
          .map(card => card.responsible)
          .filter(Boolean)
      )
    ]
      .sort()
      .forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        responsibleFilter.appendChild(option);
      });

    const labels = new Map();

    processedCards.forEach(card => {
      (card.labels || []).forEach(label => {
        labels.set(
          label.id,
          label.name || label.color || "Unnamed label"
        );
      });
    });

    [...labels.entries()]
      .sort((a, b) => a[1].localeCompare(b[1]))
      .forEach(([id, name]) => {
        const option = document.createElement("option");
        option.value = id;
        option.textContent = name;
        labelFilter.appendChild(option);
      });
  }

  function getFilteredCards() {
    const search = document
      .getElementById("searchFilter")
      .value
      .trim()
      .toLowerCase();

    const selectedLists = [
  ...document.querySelectorAll(
    '#listFilterOptions input[type="checkbox"]:checked'
  )
].map(
  checkbox => checkbox.value
);

    const responsible =
      document.getElementById("responsibleFilter").value;

    const label =
      document.getElementById("labelFilter").value;

    const status =
      document.getElementById("statusFilter").value;

    return processedCards.filter(card => {
      if (
        search &&
        !card.name.toLowerCase().includes(search)
      ) {
        return false;
      }

      if (
  selectedLists.length &&
  !selectedLists.includes(card.idList)
) {
  return false;
}

      if (
        responsible &&
        card.responsible !== responsible
      ) {
        return false;
      }

      if (
        label &&
        !(card.labels || []).some(
          item => item.id === label
        )
      ) {
        return false;
      }

      if (status === "baseline-exceeded") {
        if (!card.baselineExceeded) return false;
      } else if (status && card.status !== status) {
        return false;
      }

      return true;
    });
  }

  function renderMonthHeader() {
    const groups = [];

    workingDays.forEach((date, index) => {
      const key =
        date.getFullYear() + "-" + date.getMonth();

      let group = groups.find(
        item => item.key === key
      );

      if (!group) {
        group = {
          key,
          label: date.toLocaleDateString(
            "en-AU",
            {
              month: "long",
              year: "numeric"
            }
          ),
          start: index,
          count: 0
        };

        groups.push(group);
      }

      group.count++;
    });

    return groups
      .map(group => {
        return `
          <div
            class="month-label"
            style="
              left:${group.start * CONFIG.dayWidth}px;
              width:${group.count * CONFIG.dayWidth}px;
            "
          >
            ${escapeHTML(group.label)}
          </div>
        `;
      })
      .join("");
  }

  function renderDayHeader() {
    return workingDays
      .map((date, index) => {
        const weekday = date
          .toLocaleDateString(
            "en-AU",
            { weekday: "short" }
          )
          .substring(0, 1);

        return `
          <div
            class="day"
            style="left:${index * CONFIG.dayWidth}px"
          >
            ${weekday}
            <strong>${date.getDate()}</strong>
          </div>
        `;
      })
      .join("");
  }

  function renderTodayMarker(headerOnly) {
    const today = parseDateOnly(new Date());

    if (
      !workingDays.length ||
      today < workingDays[0] ||
      today > workingDays[workingDays.length - 1]
    ) {
      return "";
    }

    const index = getDateIndex(today, "start");

    if (index < 0) return "";

    const left =
      index * CONFIG.dayWidth +
      CONFIG.dayWidth / 2;

    if (headerOnly) {
      return `
        <div
          class="today-label"
          style="left:${left}px"
        >
          TODAY
        </div>
      `;
    }

    return `
      <div
        class="today-line"
        style="left:${left}px"
      ></div>
    `;
  }

  function renderHeader() {
    const width =
      workingDays.length * CONFIG.dayWidth;

    return `
      <div class="timeline-header">

        <div class="timeline-left header-left">
          Activity
        </div>

        <div
          class="header-track"
          style="width:${width}px"
        >
          <div class="months">
            ${renderMonthHeader()}
          </div>

          <div class="days">
            ${renderDayHeader()}
            ${renderTodayMarker(true)}
          </div>
        </div>

      </div>
    `;
  }

  function statusText(card) {
    if (card.status === "overdue") {
      return "⚑ OVERDUE";
    }

    if (card.status === "due-soon") {
      return "⚑ DUE SOON";
    }

    if (card.status === "complete") {
      return "✓ COMPLETE";
    }

    if (
      card.baselineExceeded &&
      card.variance > 0
    ) {
      return `+${card.variance}d BASELINE`;
    }

    return "";
  }

  function renderCardRow(card) {
    const current = getBarGeometry(
      card.currentStart,
      card.currentDue
    );

    const baseline = getBarGeometry(
      card.baselineStart,
      card.baselineFinish
    );

    const trackWidth =
      workingDays.length * CONFIG.dayWidth;

    const labels = (card.labels || [])
      .slice(0, 3)
      .map(label => {
        return `
          <span class="label-chip">
            ${escapeHTML(
              label.name ||
              label.color ||
              "Label"
            )}
          </span>
        `;
      })
      .join("");

    const barLabels = (card.labels || [])
      .slice(0, 2)
      .map(label => {
        return `
          <span class="activity-label">
            ${escapeHTML(
              label.name ||
              label.color ||
              "Label"
            )}
          </span>
        `;
      })
      .join("");

    let currentHTML = "";

    if (current) {
      currentHTML = `
        <div
          class="activity ${card.status}"
          data-card-id="${card.id}"
          style="
            left:${current.left}px;
            width:${current.width}px;
          "
          title="
            ${escapeHTML(card.name)}
            | Start: ${escapeHTML(formatShortDate(card.currentStart))}
            | Due: ${escapeHTML(formatShortDate(card.currentDue))}
          "
        >
          <div class="activity-title">
            ${escapeHTML(card.name)}
          </div>

          <div class="activity-bottom">
            ${barLabels}

            ${
              statusText(card)
                ? `
                  <span class="status-badge">
                    ${escapeHTML(statusText(card))}
                  </span>
                `
                : ""
            }
          </div>
        </div>
      `;
    }

    let baselineHTML = "";

    if (baseline) {
      baselineHTML = `
        <div
          class="baseline"
          title="
            Baseline:
            ${escapeHTML(formatShortDate(card.baselineStart))}
            -
            ${escapeHTML(formatShortDate(card.baselineFinish))}
          "
          style="
            left:${baseline.left}px;
            width:${baseline.width}px;
          "
        ></div>
      `;
    }

    return `
      <div class="timeline-row">

        <div
          class="card-info"
          data-card-id="${card.id}"
        >
          <div class="card-title">
            ${escapeHTML(card.name)}
          </div>

          <div class="card-meta">
            ${labels}
          </div>

          ${
            card.responsible
              ? `
                <div class="responsible">
                  Responsible:
                  <strong>
                    ${escapeHTML(card.responsible)}
                  </strong>
                </div>
              `
              : ""
          }
        </div>

        <div
          class="track"
          style="width:${trackWidth}px"
        >
          ${renderTodayMarker(false)}
          ${currentHTML}
          ${baselineHTML}
        </div>

      </div>
    `;
  }

  function bindCardClicks() {
    document
      .querySelectorAll("[data-card-id]")
      .forEach(element => {
        element.addEventListener("click", function () {
          const cardId = this.dataset.cardId;

          if (cardId) {
            t.showCard(cardId);
          }
        });
      });
  }

  function renderTimeline() {
    const filtered = getFilteredCards();

    const timeline =
      document.getElementById("timeline");

    const summary =
      document.getElementById("summary");

    if (!processedCards.length) {
      timeline.innerHTML = `
        <div class="message">
          No cards with current or Baseline dates were found.
        </div>
      `;

      summary.textContent =
        "No timeline activities found.";

      return;
    }

    const width =
      workingDays.length * CONFIG.dayWidth;

    let html = renderHeader();

    listData.forEach(list => {
      const cards = filtered.filter(
        card => card.idList === list.id
      );

      if (!cards.length) return;

      html += `
        <div class="list-row">
          <div class="list-title">
            ${escapeHTML(list.name)}
          </div>

          <div
            class="list-track"
            style="width:${width}px"
          ></div>
        </div>
      `;

      cards.forEach(card => {
        html += renderCardRow(card);
      });
    });

    timeline.style.setProperty(
      "--timeline-width",
      width + "px"
    );

    timeline.innerHTML = html;

    summary.textContent =
      `${filtered.length} of ${processedCards.length} activities shown`;

    bindCardClicks();
  }

  async function loadData() {
    try {
      const restApi = await t.getRestApi();

      const authorized =
        await restApi.isAuthorized();

      if (!authorized) {
  document.getElementById("timeline").innerHTML = `
    <div class="message">
      <p>
        Project Timeline needs permission to read this Trello board.
      </p>

      <button
        id="authorizeTrello"
        type="button"
        style="
          background:#434E46;
          color:#FFFBF2;
          border:0;
          border-radius:6px;
          padding:10px 18px;
          font-weight:700;
          cursor:pointer;
        "
      >
        Authorize Trello
      </button>
    </div>
  `;

  document.getElementById("summary").textContent =
    "Authorization required.";

  document
    .getElementById("authorizeTrello")
    .addEventListener("click", async function () {
      try {
        await restApi.authorize({
          scope: "read",
          expiration: "never"
        });

        window.location.reload();

      } catch (error) {
        console.error("Trello authorization failed:", error);
      }
    });

  return;
}

      const basicBoard =
        await t.board("id", "name");

      const token =
        await restApi.getToken();

      const key =
        TRELLO_API_KEY;

      const boardId =
        basicBoard.id;

      const boardResponse =
        await fetch(
          `https://api.trello.com/1/boards/${boardId}?fields=id,name&customFields=true&key=${encodeURIComponent(key)}&token=${encodeURIComponent(token)}`
        );

      boardData =
        await boardResponse.json();

      const listsResponse =
        await fetch(
          `https://api.trello.com/1/boards/${boardId}/lists?fields=id,name&key=${encodeURIComponent(key)}&token=${encodeURIComponent(token)}`
        );

      listData =
        await listsResponse.json();

      const cardsResponse =
  await fetch(
    `https://api.trello.com/1/boards/${boardId}/cards?fields=id,name,start,due,dueComplete,idList,url,labels&customFieldItems=true&key=${encodeURIComponent(key)}&token=${encodeURIComponent(token)}`
  );

      cardData =
        await cardsResponse.json();

      buildCustomFieldMap();
      processCards();
      calculateRange(processedCards);
      buildWorkingDays();
      populateFilters();
      renderTimeline();

    } catch (error) {
      console.error(error);

      document.getElementById("timeline").innerHTML = `
        <div class="message error">
          Could not load the Trello timeline.
        </div>
      `;

      document.getElementById("summary").textContent =
        "Timeline failed to load.";
    }
  }

  document
  .getElementById("searchFilter")
  .addEventListener("input", renderTimeline);

document
  .getElementById("responsibleFilter")
  .addEventListener("change", renderTimeline);

document
  .getElementById("labelFilter")
  .addEventListener("change", renderTimeline);

document
  .getElementById("statusFilter")
  .addEventListener("change", renderTimeline);

document
  .getElementById("listFilterOptions")
  .addEventListener("change", renderTimeline);

  loadData();
</script>

</body>
</html>
